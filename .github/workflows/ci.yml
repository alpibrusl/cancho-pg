name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built and tested with. A package store records no hash
  # of the `std` it was published against, so the revision is part of the contract.
  LEX_SYS_REV: bbeb75f6918105db6e49ec7c642f56009a911b8f

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pg

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-sys
          ref: ${{ env.LEX_SYS_REV }}
          path: lex-sys

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: lex-sys/target/release/lex-sys
          key: lex-sys-${{ env.LEX_SYS_REV }}

      - name: Build lex-sys
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: lex-sys
        run: cargo build --release -p lex-sys

      - name: The reference client
        run: which psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      # postgres:16 with a role for each way a server asks for a password (tests/postgres.sh)
      - name: PostgreSQL 16 with trust, cleartext and SCRAM roles
        working-directory: pg
        run: sh tests/postgres.sh > /tmp/pg.env.sh

      - name: Unit tests (no server)
        working-directory: pg
        run: ../lex-sys/target/release/lex-sys test tests/pg_test.ls src/pg.ls --std

      - name: Formatting
        working-directory: pg
        run: ../lex-sys/target/release/lex-sys fmt --check src tests tools examples pooler

      # The real server and the stock psql client as the reference: every query must print
      # the same rows, errors and tags must be the server's, parameters must stay data; and
      # the logins: trust, cleartext password, SCRAM-SHA-256 (ASCII and not), and a server
      # that is not the real one.
      - name: End-to-end tests against PostgreSQL 16
        working-directory: pg
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
        run: |
          eval "$(cat /tmp/pg.env.sh)"
          python3 tests/e2e.py

      # The pooler's first slice (docs/pooler.md, P0): a transparent proxy. The whole end-to-end suite
      # again, with every client and every test going through it to the same PostgreSQL.
      - name: End-to-end tests through the proxy (pooler P0)
        working-directory: pg
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
        run: |
          mkdir -p build
          ../lex-sys/target/release/lex-sys build --std pooler/proxy.ls -o build/proxy
          build/proxy 6433 127.0.0.1 5432 &
          sleep 1
          eval "$(cat /tmp/pg.env.sh)"
          PGPORT=6433 python3 tests/e2e.py
          kill %1

      # A consumer locks names from the checked-in store; it must be the store of this source.
      - name: The published store is the store of src/pg.ls
        working-directory: pg
        run: |
          rm -rf /tmp/store
          ../lex-sys/target/release/lex-sys vcs publish --std --store /tmp/store src/pg.ls > /dev/null
          diff -r /tmp/store .lex-sys-vcs

      # `pg.pool` is a package of its own, published beside `pg` and requiring the two names it uses
      # (`size`, `kind`) from `pg`'s store; the same rule: the checked-in store is the store of the source.
      - name: The published store is the store of src/pool.ls
        working-directory: pg
        run: |
          # published beside the checked-in one: the store records the path of the store it requires
          # relative to itself, so a copy elsewhere would differ in that one line
          rm -rf .lex-sys-vcs-pool-check
          lex=../lex-sys/target/release/lex-sys
          $lex vcs lock --store .lex-sys-vcs -o /tmp/pg-for-pool.lock size kind > /dev/null
          $lex vcs publish --std --store .lex-sys-vcs-pool-check --requires /tmp/pg-for-pool.lock:.lex-sys-vcs src/pool.ls > /dev/null
          diff -r .lex-sys-vcs-pool-check .lex-sys-vcs-pool
