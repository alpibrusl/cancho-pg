name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built and tested with. A package store records no hash
  # of the `std` it was published against, so the revision is part of the contract. It is
  # also `[package] cancho` in cancho.toml (checked below), and it has packages/tls (docs/tls.md).
  CANCHO_REV: a4572ea3b506e4bcec1c4be43deda1043c11ba9f

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pg

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ env.CANCHO_REV }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: The reference client
        run: which psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      # One compiler revision: the one CI builds is the one the project file names.
      - name: cancho.toml names the compiler CI builds
        working-directory: pg
        run: grep -qx "cancho = \"$CANCHO_REV\"" cancho.toml

      # cancho's TLS client (packages/tls and the x509 it requires), at the pinned commit, into build/deps:
      # what pg.pool and pg.ssl are built with (docs/tls.md section 9). pg itself needs none of it.
      - name: Dependencies (cancho install)
        working-directory: pg
        run: ../cancho/target/release/cancho install

      # postgres:16 with a role for each way a server asks for a password, TLS on with a test CA made in the
      # job, a hostssl and a hostnossl role, and a second server without TLS (tests/postgres.sh)
      - name: PostgreSQL 16 with trust, cleartext and SCRAM roles, and TLS
        working-directory: pg
        run: sh tests/postgres.sh > /tmp/pg.env.sh

      - name: Unit tests (no server)
        working-directory: pg
        run: ../cancho/target/release/cancho test tests/pg_test.cho src/pg.cho --std

      # What the pool decides with no server (the arguments of `reconnect`, what is due when, the waits), and that the script
      # `pgen` writes is a Parse and a Sync for each statement.
      - name: Pool unit tests (no server)
        working-directory: pg
        run: ../cancho/target/release/cancho test tests/pool_test.cho src/pool.cho src/pg.cho tests/generated/queries.cho build/deps/*.cho --std

      - name: Formatting
        working-directory: pg
        run: ../cancho/target/release/cancho fmt --check src tests tools examples pooler

      # The real server and the stock psql client as the reference: every query must print
      # the same rows, errors and tags must be the server's, parameters must stay data; and
      # the logins: trust, cleartext password, SCRAM-SHA-256 (ASCII and not), and a server
      # that is not the real one.
      - name: End-to-end tests against PostgreSQL 16
        working-directory: pg
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
        run: |
          eval "$(cat /tmp/pg.env.sh)"
          python3 tests/e2e.py

      # The pool that makes its own connections (docs/reconnect.md): backends killed idle and mid-request, a server that goes
      # away and comes back, a database that is black-holed, silent, or refuses the password; against PostgreSQL behind
      # tests/tcpproxy.py, and against mock servers that answer the login badly. Each run reports the longest the loop
      # was kept from waiting.
      - name: Reconnecting pool tests (kill, cut, restore)
        working-directory: pg
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
        run: |
          eval "$(cat /tmp/pg.env.sh)"
          python3 tests/reconnect_test.py

      # The pooler's first slice (docs/pooler.md, P0): a transparent proxy. The whole end-to-end suite
      # again, with every client and every test going through it to the same PostgreSQL.
      - name: End-to-end tests through the proxy (pooler P0)
        working-directory: pg
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
        run: |
          mkdir -p build
          ../cancho/target/release/cancho build --std pooler/proxy.cho -o build/proxy
          build/proxy 6433 127.0.0.1 5432 &
          sleep 1
          eval "$(cat /tmp/pg.env.sh)"
          PGPORT=6433 python3 tests/e2e.py
          kill %1

      # P1 (docs/pooler.md section 8): the transaction pooler. The framing state machines from bytes, then the pooler against the same PostgreSQL over the
      # raw protocol: transaction boundaries, queueing, pipelining, refusals, server failures, volume, hostile bytes.
      - name: Pooler framing tests (every cut of every message)
        working-directory: pg
        run: ../cancho/target/release/cancho test tests/frame_test.cho pooler/frame.cho --std

      - name: Pooler SCRAM tests (RFC 7677, against the driver's HMAC and base64 at every length)
        working-directory: pg
        run: ../cancho/target/release/cancho test tests/scram_test.cho pooler/scram.cho src/pg.cho --std

      - name: Pooler end-to-end tests (P1)
        working-directory: pg
        run: |
          mkdir -p build
          ../cancho/target/release/cancho build --std pooler/pooler.cho pooler/frame.cho pooler/scram.cho src/pg.cho -o build/pooler
          eval "$(cat /tmp/pg.env.sh)"
          PGDATABASE=postgres python3 pooler/tests/pooler_e2e.py build/pooler

      # A consumer locks names from the checked-in stores; each must be the store of its source: pg (src/pg.cho), pg.pool
      # (src/pool.cho, requiring the names it calls of pg and of cancho's tls), pg.ssl (src/ssl.cho, the same).
      - name: The published stores are the stores of src/pg.cho, src/pool.cho and src/ssl.cho
        working-directory: pg
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
        run: sh tests/stores.sh

      # TLS (docs/tls.md section 10): the blocking client and the pool against the TLS server with verify-full; a wrong name, an
      # unknown authority, an empty trust store, the modes not offered; the server without TLS; hostssl and hostnossl both ways;
      # mock servers that answer SSLRequest badly or break a live session; the pool's server restarted (last: the restart is
      # of this job's server); the authority of two programs.
      - name: TLS tests
        working-directory: pg
        env:
          CANCHO: ${{ github.workspace }}/cancho/target/release/cancho
        run: |
          eval "$(cat /tmp/pg.env.sh)"
          python3 tests/tls_test.py
